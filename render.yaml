services:
  - type: web
    name: gestionale-birra
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # DATABASE_URL va impostata manualmente nel dashboard Render
      # con l'URL di connessione di Supabase (PostgreSQL gratuito, senza scadenza)
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
