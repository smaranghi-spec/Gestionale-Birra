<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crea il tuo birrificio — {{ legal.nome_servizio }}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d1117">
  <style>
    :root{--bg:#0d1117;--card:#1c2333;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--amber:#f59e0b;--amber-dim:rgba(245,158,11,.12);--red:#f85149;--red-dim:rgba(248,81,73,.12);--green:#3fb950;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .wrap{width:100%;max-width:480px;}
    .brand{text-align:center;margin-bottom:22px;}
    .brand h1{font-size:22px;margin:6px 0 4px;}
    .brand p{color:var(--muted);font-size:14px;margin:0;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px;}
    label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
    input[type=text],input[type=email],input[type=password]{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:14px;}
    input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-dim);}
    .row{margin-bottom:13px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text);margin-bottom:10px;text-transform:none;letter-spacing:0;font-weight:400;}
    .chk input{margin-top:3px;}
    a{color:var(--amber);}
    .btn{width:100%;padding:12px;border-radius:8px;border:none;background:var(--amber);color:#000;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px;}
    .alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;border:1px solid var(--red);background:var(--red-dim);color:var(--red);}
    .perks{font-size:12px;color:var(--muted);margin:0 0 16px;padding-left:18px;line-height:1.7;}
    @media(max-width:480px){.grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div style="font-size:48px;">🍺</div>
    <h1>Crea il tuo birrificio digitale</h1>
    <p>Piano Free gratuito per sempre · nessuna carta richiesta</p>
  </div>
  <div class="card">
    {% if errore %}<div class="alert">{{ errore }}</div>{% endif %}
    <ul class="perks">
      <li>Fino a 3 ricette, cotte illimitate, magazzino e BeerXML</li>
      <li>Passa a Pro (14,90 €/anno) quando vuoi: ricette illimitate</li>
    </ul>
    <form method="post" action="/signup" autocomplete="on">
      <div class="row"><label>Nome birrificio / homebrewer</label><input type="text" name="nome_birrificio" required maxlength="120" value="{{ form.nome_birrificio or '' }}"></div>
      <div class="row"><label>Email</label><input type="email" name="email" required value="{{ form.email or '' }}"></div>
      <div class="row"><label>Username</label><input type="text" name="username" required minlength="3" value="{{ form.username or '' }}"></div>
      <div class="grid row">
        <div><label>Password (min 8)</label><input type="password" name="password" required minlength="8" autocomplete="new-password"></div>
        <div><label>Conferma</label><input type="password" name="conferma_password" required minlength="8" autocomplete="new-password"></div>
      </div>
      <label class="chk"><input type="checkbox" name="accetto_termini" value="1" required> <span>Ho letto e accetto i <a href="/termini" target="_blank">Termini di Servizio</a> e l'<a href="/privacy" target="_blank">Informativa Privacy</a>.</span></label>
      <label class="chk"><input type="checkbox" name="maggiorenne" value="1" required> <span>Dichiaro di avere almeno 18 anni.</span></label>
      <button type="submit" class="btn">Crea account gratuito →</button>
    </form>
    <div style="text-align:center;margin-top:14px;font-size:13px;color:var(--muted);">Hai già un account? <a href="/login">Accedi</a></div>
  </div>
</div>
</body>
</html>
